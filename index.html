:root { --ink:#16202b; --muted:#5d6b7a; --line:#d9e0e8; --accent:#1f4e78; --accent-ink:#ffffff; --bg:#f3f5f8; --panel:#ffffff; --hover:#eef3f9; --row:#eef1f5; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ink:#e6ebf1; --muted:#9aa8b6; --line:#2e3a47; --accent:#6ea8dc; --accent-ink:#0d1620; --bg:#111821; --panel:#18222d; --hover:#203040; --row:#23303d; color-scheme: dark; } }
:root[data-theme="dark"] { --ink:#e6ebf1; --muted:#9aa8b6; --line:#2e3a47; --accent:#6ea8dc; --accent-ink:#0d1620; --bg:#111821; --panel:#18222d; --hover:#203040; --row:#23303d; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin:0; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color:var(--ink); background:var(--bg); }
#ui { max-width: none; margin: 0; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
h1 { font-size:20px; margin:0 0 8px; color:var(--accent); }
h2 { font-size:15px; margin:0; }
.sub { font-size:12px; color:var(--muted); font-weight:400; }
.status { font-size:12px; color:var(--muted); }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; margin-top:12px; }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.between { justify-content:space-between; }
input[type=search] { flex:1; min-width:220px; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:14px; }
button, .filebtn { padding:7px 12px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; font-size:13px; }
.filebtn input { display:none; }
button.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
button.ghost { background:transparent; }
.chk { font-size:13px; color:var(--muted); }
.dd { position:relative; }
.ddpanel { position:absolute; right:0; top:calc(100% + 4px); z-index:20; width:min(280px, 86vw); max-height:360px; overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:8px; box-shadow:0 6px 24px rgba(0,0,0,.12); padding:8px; }
.ddpanel label { display:flex; gap:8px; align-items:center; padding:4px 2px; font-size:13px; cursor:pointer; }
.ddpanel label .n { margin-left:auto; color:var(--muted); font-size:12px; }
.ddpanel .all { border-bottom:1px solid var(--row); margin-bottom:4px; }
.ddpanel input[type=search] { width:100%; margin:4px 0 6px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; }
.resbar { margin-top:6px; min-height:26px; }
#results { list-style:none; margin:8px 0 0; padding:0; max-height:260px; overflow:auto; }
#results li { display:flex; justify-content:space-between; gap:8px; padding:6px 4px; border-bottom:1px solid var(--row); cursor:pointer; }
#results li:hover { background:var(--hover); }
#results .ar { font-family:"AR1","LA1"; direction:rtl; color:var(--ink); }
#results .sku { font-weight:600; min-width:48px; }
#results .cat { font-size:11px; color:var(--muted); min-width:90px; }
table { width:100%; border-collapse:collapse; margin-top:8px; }
th, td { text-align:left; padding:6px; border-bottom:1px solid var(--row); font-size:13px; }
td input { width:64px; padding:4px; }
.pv { margin-top:14px; }
#preview { display:flex; flex-wrap:wrap; gap:10px; margin-top:8px; }

/* ---------- The label: a 40 x 25 mm black/white bitmap ---------- */
img.label { display:block; width:40mm; height:25mm; image-rendering: pixelated; image-rendering: crisp-edges; }
#preview img.label { width:120mm; max-width:100%; height:auto; aspect-ratio:8/5; border:1px solid var(--line); background:#fff; }
.settings { display:flex; gap:12px; flex-wrap:wrap; align-items:center; font-size:13px; color:var(--muted); margin-top:8px; }
.settings input[type=number] { width:64px; padding:4px; }
.settings select { padding:4px; }

/* ---------- Printing ---------- */
#sheet { display:none; }
@page { size: 40mm 25mm; margin: 0; }
@media print {
  html, body { background:#fff; margin:0; padding:0; }
  .no-print { display:none !important; }
  #sheet { display:block; }
  #sheet img.label { width:40mm; height:25mm; margin:0; page-break-after: always; break-after: page; }
  #sheet img.label:last-child { page-break-after: auto; break-after: auto; }
}

body { background:var(--bg); color:var(--ink); }
input, select { background:var(--panel); color:var(--ink); border:1px solid var(--line); }
button:focus-visible, input:focus-visible, select:focus-visible, .filebtn:focus-within { outline:2px solid var(--accent); outline-offset:2px; }
#results li { display:grid; grid-template-columns: 52px minmax(0,1.3fr) minmax(70px,0.5fr) minmax(0,1.2fr) 96px; align-items:center; column-gap:10px; }
#results li > span { min-width:0; overflow-wrap:anywhere; }
#results .cat { min-width:0; }
#results .ar { text-align:right; }
#results li > span:last-child { text-align:right; font-variant-numeric: tabular-nums; }
@media (max-width: 600px) {
  #results li { grid-template-columns: 44px minmax(0,1fr) auto; row-gap:2px; }
  #results li > span:nth-child(1) { grid-area: 1 / 1; } #results li > span:nth-child(2) { grid-area: 1 / 2; }
  #results li > span:nth-child(5) { grid-area: 1 / 3; white-space:nowrap; }
  #results li > span:nth-child(3) { grid-area: 2 / 2 / 3 / 4; } #results li > span:nth-child(4) { grid-area: 3 / 2 / 4 / 4; }
}
.howto { font-size:12px; color:var(--muted); margin:8px 0 0; }
.updated { font-size:12px; color:var(--muted); }
/* full-screen layout: on wide screens, item search on the left, print list on the right */
@media (min-width: 1100px) {
  #ui { display:grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap:16px; align-items:start; min-height:100vh; }
  #ui > header { grid-column: 1 / -1; }
  #ui > .panel { margin-top:8px; min-width:0; }
  #ui > .panel:first-of-type { position:sticky; top:8px; }
  #results { max-height: calc(100vh - 190px); }
}

</style>
</head>
<body>

<div id="ui" class="no-print">
  <header>
    <h1>Barcode Labels <span class="sub">40 × 25 mm</span></h1>
    <div id="status" class="status">Loading items…</div>
  </header>

  <section class="panel">
    <div class="row">
      <input id="search" type="search" placeholder="Search by SKU, English or Arabic name…" autocomplete="off">
      <div class="dd" id="catDD">
        <button id="catBtn" class="ghost" type="button">Category: All ▾</button>
        <div id="catPanel" class="ddpanel" hidden>
          <label class="all"><input type="checkbox" id="catAll" checked> <b>Select all</b></label>
          <input id="catSearch" type="search" placeholder="Find category…">
          <div id="catList"></div>
        </div>
      </div>
      <label class="filebtn">Load CSV<input id="csv" type="file" accept=".csv,text/csv"></label>
    </div>
    <div class="row between resbar"><span id="resInfo" class="sub"></span><button id="addAll" class="ghost" type="button" hidden>Add all listed</button></div>
    <ul id="results"></ul>
  </section>

  <section class="panel">
    <div class="row between">
      <h2>Print list <span id="count" class="sub"></span></h2>
      <div class="row">
        <label class="chk"><input type="checkbox" id="showCompany" checked> Company name</label>
        <button id="clear" class="ghost">Clear</button>
        <button id="print" class="primary">Print labels</button>
      </div>
    </div>
    <table id="queue"><thead><tr><th>SKU</th><th>Item</th><th>Price</th><th>Labels</th><th></th></tr></thead><tbody></tbody></table>
    <div class="settings">
      <strong>Printer adjust:</strong>
      <label>Font style <select id="setStyle"></select></label>
      <label title="Thicker letters - only for light printers"><input id="setEmb" type="checkbox"> Extra bold</label>
      <label>Printer <select id="setDpi"><option value="8">203 dpi</option><option value="12">300 dpi</option></select></label>
      <label>Move right (mm) <input id="setX" type="number" step="0.5"></label>
      <label>Move down (mm) <input id="setY" type="number" step="0.5"></label>
      <label>Size % <input id="setScale" type="number" step="1" min="70" max="110"></label>
      <label><input id="setRot" type="checkbox"> Rotate 180°</label>
      <label title="Tick if the label prints black with white text"><input id="setInv" type="checkbox"> Invert colours</label>
      <label title="Higher = bolder text">Text boldness <input id="setThr" type="range" min="100" max="230" step="5"></label>
      <button id="testPrint" class="ghost">Print 1 test label</button>
    </div>
    <p class="howto">In the print window choose the label printer, paper 40 × 25 mm, margins <b>None</b>, scale <b>100%</b> (not "Fit to page").</p>
    <h2 class="pv">Preview <span class="sub">(exactly what is sent to the printer)</span></h2>
    <div id="preview"></div>
  </section>
</div>

<div id="sheet"></div>

function loadFromCreator() {
  if (!(window.ZOHO && ZOHO.CREATOR && ZOHO.CREATOR.init)) { setStatus("Not running inside Zoho Creator - use Load CSV."); return; }
  ZOHO.CREATOR.init().then(function () {
    try { var ip = ZOHO.CREATOR.UTIL.getInitParams(); if (ip && (ip.appLinkName || ip.appName)) CONFIG.appName = ip.appLinkName || ip.appName; } catch (e) {}
    var all = [], page = 1;
    function next() {
      ZOHO.CREATOR.API.getAllRecords({ appName: CONFIG.appName, reportName: CONFIG.reportName, page: page, pageSize: CONFIG.pageSize })
        .then(function (resp) {
          var data = (resp && resp.data) || [];
          data.forEach(function (r) {
            var f = CONFIG.fields;
            all.push({ sku: String(r[f.sku] || "").trim(), name: r[f.name] || "", ar: r[f.arabic] || "", price: r[f.price], cat: r[f.category] || "" });

          if (data.length === CONFIG.pageSize) { page++; next(); }
          else { setItems(all, "Zoho Creator"); }

        .catch(function (e) {
          if (all.length) { setItems(all, "Zoho Creator"); }
          else { setStatus("Could not read report '" + CONFIG.reportName + "' - check app/report names, or use Load CSV."); console.log(e); }
        });

  });
}

  ITEMS = list.filter(function (i) { return i.sku; });
  ITEMS.sort(function (a, b) { return a.sku.localeCompare(b.sku); });

function barcodeBits(text) {
  var o = {};
  JsBarcode(o, text, { format: "CODE128" });

}
function drawLabel(it) {
  var D = SET.dpmm, W = Math.round(40 * D), H = Math.round(25 * D);
  var c = document.createElement("canvas"); c.width = W; c.height = H;
  var x = c.getContext("2d");
  x.fillStyle = "#fff"; x.fillRect(0, 0, W, H);
  x.save();
  if (SET.rot) { x.translate(W, H); x.rotate(Math.PI); }
  var s = SET.scale / 100;
  x.translate(W / 2 + SET.offX * D, H / 2 + SET.offY * D); x.scale(s, s); x.translate(-W / 2, -H / 2);
  x.fillStyle = "#000"; x.textBaseline = "alphabetic";
  var pad = 2.0 * D, padV = 1.6 * D, maxW = W - 2 * pad, y = padV;   // safe margins on all sides

  var EMB = SET.emb ? 0.09 * D : 0;   // optional extra stroke for very light printers
  x.lineWidth = EMB || 1; x.strokeStyle = "#000"; x.lineJoin = "round";
  function txt(t, tx, ty, mw) { if (mw) { x.fillText(t, tx, ty, mw); if (EMB) x.strokeText(t, tx, ty, mw); } else { x.fillText(t, tx, ty); if (EMB) x.strokeText(t, tx, ty); } }
  DRAW_TXT = txt;

  // Arabic name: ExtraBold, up to 2 lines, shrink to fit (min 2.1 mm)
  var ar = isoLatin(it.ar), size, r;
  if (ar) {
    for (size = 3.0; size >= 2.1; size -= 0.1) { x.font = "700 " + (size * D) + "px " + fontStack(); r = wrap(x, ar, maxW, 2); if (r.ok) break; }
    r.lines.slice(0, 2).forEach(function (l) { y += size * D * 0.98; drawRtlLine(x, l, W / 2, y); });
    y += 0.9 * D;   // clear gap between Arabic and English names
  }
  // English name: ExtraBold, 1 line (min 2.0 mm) or wrap to 2 lines - never tiny
  x.direction = "ltr"; x.textAlign = "center";
  var en = String(it.name || "").replace(/\s+/g, " ").trim(), enLines = [en];
  for (size = 2.5; size >= 2.0; size -= 0.1) { x.font = "700 " + (size * D) + "px " + fontStack(); if (x.measureText(en).width <= maxW) break; }
  if (x.measureText(en).width > maxW) {
    for (size = 2.2; size >= 1.9; size -= 0.1) { x.font = "700 " + (size * D) + "px " + fontStack(); r = wrap(x, en, maxW, 2); if (r.ok) break; }
    enLines = r.lines.slice(0, 2);
  }
  enLines.forEach(function (l) { x.direction = "ltr"; x.textAlign = "center"; y += size * D * 0.95; txt(l, W / 2, y, maxW); });

  // bottom rows: company, then SKU / price
  var showCo = $("showCompany").checked, yb = H - padV;
  x.direction = "ltr";
  if (showCo) { x.textAlign = "center"; x.font = "700 " + (1.9 * D) + "px " + fontStack(); txt(CONFIG.company, W / 2, yb, maxW); yb -= 2.1 * D; }
  x.font = "700 " + (3.0 * D) + "px " + fontStack(); x.textAlign = "right"; txt(money(it.price), W - pad, yb);
  x.font = "700 " + (2.6 * D) + "px " + fontStack(); x.textAlign = "left"; txt(it.sku, pad, yb);
  var rowTop = yb - 2.6 * D;

  // barcode: bars snapped to whole printer dots
  try {
    var bits = barcodeBits(it.sku), quiet = 2.5 * D;
    var mw = Math.max(1, Math.min(Math.floor(3 * D / 8), Math.floor((W - 2 * quiet) / bits.length)));
    var bw = bits.length * mw, bx = Math.round((W - bw) / 2);
    var room = rowTop - 0.4 * D - (y + 0.5 * D), bh = Math.round(Math.min(6 * D, Math.max(3.5 * D, room)));   // barcode height 3.5-6 mm
    var top = Math.round(y + 0.5 * D + Math.max(0, (room - bh) / 2));
    for (var i = 0; i < bits.length; i++) if (bits[i] === "1") x.fillRect(bx + i * mw, top, mw, bh);
  } catch (e) { console.log(e); }
  x.restore();

  // threshold to pure black / white (no grey -> no printer dithering pattern)
  var img = x.getImageData(0, 0, W, H), d = img.data;
  var thr = SET.thr || 165, ink = SET.inv ? 255 : 0, paper = SET.inv ? 1 : 254;
  for (var p = 0; p < d.length; p += 4) { var v = (d[p] * 0.3 + d[p + 1] * 0.59 + d[p + 2] * 0.11) < thr ? ink : paper; d[p] = d[p + 1] = d[p + 2] = v; d[p + 3] = 255; }
  // one mid-grey corner dot keeps the image 8-bit, so drivers do not switch to an inverted 1-bit palette
  d[0] = d[1] = d[2] = 250;
  x.putImageData(img, 0, 0);
  return c.toDataURL("image/png");
}
function makeLabel(it) {

}
function fitAll() {}
function printLabels() {

  FONTS_READY.then(function () {
    var sheet = $("sheet"); sheet.innerHTML = "";
    QUEUE.forEach(function (x) { var src = drawLabel(x.item); for (var n = 0; n < x.qty; n++) { var im = document.createElement("img"); im.className = "label"; im.src = src; sheet.appendChild(im); } });

function printTest() {

  FONTS_READY.then(function () { var sheet = $("sheet"); sheet.innerHTML = ""; var im = document.createElement("img"); im.className = "label"; im.src = drawLabel(it); sheet.appendChild(im); setTimeout(function () { window.print(); }, 300); });
}
function alertMsg(t) { setStatus(t); }
function bindSettings() {
  var map = { setDpi: "dpmm", setX: "offX", setY: "offY", setScale: "scale" };
  Object.keys(map).forEach(function (id) {
    var el = $(id); if (!el) return; el.value = SET[map[id]];
    el.addEventListener("change", function () { SET[map[id]] = parseFloat(el.value) || 0; if (!SET.scale) SET.scale = 100; saveSet(); renderQueue(); });
  });
  var r = $("setRot"); if (r) { r.checked = !!SET.rot; r.addEventListener("change", function () { SET.rot = r.checked; saveSet(); renderQueue(); }); }
  var iv = $("setInv"); if (iv) { iv.checked = !!SET.inv; iv.addEventListener("change", function () { SET.inv = iv.checked; saveSet(); renderQueue(); }); }
  var st = $("setStyle"); if (st) { st.innerHTML = STYLES.map(function (o) { return '<option value="' + o.n + '">' + o.name + "</option>"; }).join(""); st.value = SET.style || 4; st.addEventListener("change", function () { SET.style = parseInt(st.value, 10); saveSet(); renderQueue(); }); }
  var em = $("setEmb"); if (em) { em.checked = !!SET.emb; em.addEventListener("change", function () { SET.emb = em.checked; saveSet(); renderQueue(); }); }
  var th = $("setThr"); if (th) { th.value = SET.thr || 165; th.addEventListener("change", function () { SET.thr = parseInt(th.value, 10) || 165; saveSet(); renderQueue(); }); }
  var t = $("testPrint"); if (t) t.addEventListener("click", printTest);
}

/* ---------- Wiring ---------- */
document.addEventListener("DOMContentLoaded", function () {
  $("search").addEventListener("input", renderResults);
  $("catBtn").addEventListener("click", function (e) { e.stopPropagation(); $("catPanel").hidden = !$("catPanel").hidden; });
  $("catPanel").addEventListener("click", function (e) { e.stopPropagation(); });
  document.addEventListener("click", function () { $("catPanel").hidden = true; });
  $("catAll").addEventListener("change", function () { SEL = $("catAll").checked ? null : {}; renderCats(); renderResults(); });
  $("catSearch").addEventListener("input", renderCats);
  $("catList").addEventListener("change", function (e) { var c = e.target.getAttribute("data-cat"); if (c != null) toggleCat(c, e.target.checked); });
  $("addAll").addEventListener("click", function () {
        LISTED.forEach(function (it) { if (!QUEUE.some(function (x) { return x.item === it; })) QUEUE.push({ item: it, qty: 1 }); });
    renderQueue();
  });
  $("results").addEventListener("click", function (e) { var li = e.target.closest("li"); if (li) addToQueue(ITEMS[+li.getAttribute("data-k")]); });
  // Typing a new label count: let the box be cleared while typing; only fix it to 1 when the viewer leaves it empty or below 1.
  function updateCount() { var t = QUEUE.reduce(function (s, x) { return s + x.qty; }, 0); $("count").textContent = t ? "(" + t + " labels)" : ""; }
  $("queue").addEventListener("input", function (e) { var i = e.target.getAttribute("data-i"); if (i == null) return; var n = parseInt(e.target.value, 10); if (n >= 1) { QUEUE[+i].qty = n; updateCount(); } });
  $("queue").addEventListener("change", function (e) { var i = e.target.getAttribute("data-i"); if (i == null) return; var n = parseInt(e.target.value, 10); if (!(n >= 1)) n = 1; QUEUE[+i].qty = n; e.target.value = n; updateCount(); });
  $("queue").addEventListener("click", function (e) { var i = e.target.getAttribute("data-del"); if (i != null) { QUEUE.splice(+i, 1); renderQueue(); } });
  $("clear").addEventListener("click", function () { QUEUE = []; renderQueue(); });
  $("print").addEventListener("click", printLabels);
  $("showCompany").addEventListener("change", renderQueue);
  $("csv").addEventListener("change", function (e) { if (e.target.files[0]) loadCSV(e.target.files[0]); });
  bindSettings();
  setItems(EMBEDDED_ITEMS, 'item list updated 30 Oct 2026 00:57');
  // Load the newest item list straight from the server (the ?t= part skips GitHub's 10-minute page cache)
  fetch('items-data.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {

});
